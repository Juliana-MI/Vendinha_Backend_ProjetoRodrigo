<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e3f2fd; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin: 20px auto;
        }

        h2 {
            color: #1565c0;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #90caf9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 5px rgba(25, 118, 210, 0.3);
        }

        .btn-avancar {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-avancar:hover {
            background-color: #1565c0;
        }

        .mb-4 {
            margin-bottom: 20px;
        }
        
        .btn-voltar {
            display: inline-block;
            text-decoration: none;
            color: #6c757d;
            font-weight: 500;
            padding: 5px 10px;
            border: 1px solid #6c757d;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-voltar:hover {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>👤 Cadastro do Cliente</h2>
        <div class="mb-4">
            <a href="index.html" class="btn-voltar">
                ⬅️ Voltar para a Lista
            </a>
        </div>
        <form id="formCadastro">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nomeCompleto" placeholder="Ex: Ana Silva" required>
            </div>
            <div class="form-group">
                <label>CPF (Apenas números)</label>
                <input type="text" id="cpf" placeholder="12345678901" maxlength="11" required>
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" id="dataNascimento" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="ana@email.com" required>
            </div>
            <div class="form-group">
                <label>Celular</label>
                <input type="text" id="celular" placeholder="(14) 99999-9999" required>
            </div>
            <div class="form-group">
                <label>Gênero</label>
                <select id="genero">
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="valorDivida">Valor da Dívida Inicial (R$):</label>
                <input type="number" id="valorDivida" name="valorDivida" step="0.01" min="0" placeholder="0.00" value="0.00">
            </div>
            <button type="submit" class="btn-avancar">Salvar e Avançar ➡️</button>
        </form>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(event) {
            event.preventDefault(); // Impede a página de recarregar incorretamente antes de enviar à API
            cadastrarClienteEDivida();
        });
        
        async function cadastrarClienteEDivida() {
            const nome = document.getElementById('nomeCompleto').value;
            const cpf = document.getElementById('cpf').value;
            const dataNascimento = document.getElementById('dataNascimento').value;
            const email = document.getElementById('email').value;
            const celular = document.getElementById('celular').value;
            const genero = document.getElementById('genero').value;
            const valorInput = document.getElementById('valorDivida').value;
            const valor = valorInput ? parseFloat(valorInput) : 0;

            
            const clienteData = {
                nomeCompleto: nome,
                cpf: cpf,
                dataNascimento: dataNascimento,
                email: email,
                celular: celular,
                genero: genero
            };

            try {
    
                const responseCliente = await fetch('http://localhost:5000/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(clienteData)
                });

                if (!responseCliente.ok) {
                    const erroTxt = await responseCliente.text();
                    alert("Erro ao cadastrar cliente: " + erroTxt);
                    return;
                }

                const clienteCadastrado = await responseCliente.json();

                if (valor > 0) {
                    const dividaData = {
                        clienteId: clienteCadastrado.id, // ID retornado diretamente do banco pelo C#
                        valor: valor,
                        paga: false
                    };

                    const responseDivida = await fetch('http://localhost:5000/api/dividas', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dividaData)
                    });

                    if (!responseDivida.ok) {
                        const erroDividaTxt = await responseDivida.text();
                        alert("Cliente cadastrado com sucesso, mas a dívida deu erro: " + erroDividaTxt);
                        return;
                    }
                }

                alert("Cadastro realizado com sucesso!");
                window.location.href = "index.html"; // Redireciona de volta para a listagem principal

            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Não foi possível conectar ao servidor backend da API.");
            }
        }
    </script>

</body>
</html>
