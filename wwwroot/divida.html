<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Controle de Dívidas</title>
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: #e3f2fd; 
			padding: 40px 20px;
			margin: 0;
		}

		.main-container {
			max-width: 800px;
			margin: 0 auto;
		}

		.card {
			background-color: #ffffff;
			padding: 25px;
			border-radius: 12px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			margin-bottom: 25px;
		}

		h2, h3 {
			margin-top: 0;
		}

		h2 {
			text-align: center;
			color: #1565c0;
			margin-bottom: 30px;
		}

		h3 {
			color: #0d47a1;
			font-size: 1.2rem;
			margin-bottom: 15px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 15px;
		}

		th, td {
			padding: 12px 15px;
			text-align: left;
			border-bottom: 1px solid #e0e0e0;
		}

		th {
			background-color: #f5f5f5;
			color: #555;
			font-weight: 600;
		}

		tr:hover {
			background-color: #f9f9f9;
		}

		.status-badge {
			padding: 4px 8px;
			border-radius: 20px;
			font-size: 0.85rem;
			font-weight: bold;
		}

		.badge-deve {
			background-color: #ffebee;
			color: #c62828;
		}

		.badge-pago {
			background-color: #e8f5e9;
			color: #2e7d32;
		}

		.link-voltar {
			display: inline-block;
			margin-bottom: 15px;
			color: #1976d2;
			text-decoration: none;
			font-weight: bold;
		}

		.btn-atualizar {
			background-color: #1976d2;
			color: white;
			border: none;
			padding: 6px 12px;
			border-radius: 4px;
			cursor: pointer;
			float: right;
			font-size: 0.85rem;
		}
	</style>
</head>
<body>

	<div class="main-container">
		<a href="cadastro.html" class="link-voltar">⬅️ Voltar para o Cadastro</a>

		<h2>💸 Painel de Dívidas (Dados Reais do PostgreSQL)</h2>

		<div class="card">
			<button onclick="carregarClientesDoBanco()" class="btn-atualizar">🔄 Atualizar Lista</button>
			<h3>👥 Lista de Clientes e Saldos</h3>
			<table>
				<thead>
					<tr>
						<th>Nome do Cliente</th>
						<th>CPF</th>
						<th>Idade</th>
						<th>Total Devido</th>
						<th>Situação</th>
					</tr>
				</thead>
				<tbody id="corpoTabela">
				</tbody>
			</table>
		</div>
	</div>
	<div class="mb-4">
		<a href="index.html" class="btn btn-outline-secondary rounded-pill">
			<i class="bi bi-arrow-left-circle me-1"></i> Voltar para a Lista
		</a>
	</div>

	<script>

		async function carregarClientesDoBanco() {
			try {
				const response = await fetch('/api/Clientes');
				if (!response.ok) throw new Error('Erro ao buscar dados.');

				const clientes = await response.json();
				const tbody = document.getElementById('corpoTabela');
				tbody.innerHTML = '';

				if (clientes.length === 0) {
					tbody.innerHTML = `<tr><td colspan="5" style="text-center; color: #777; padding: 20px;">Nenhum cliente cadastrado no banco de dados.</td></tr>`;
					return;
				}


				clientes.forEach(c => {
					const statusClasse = c.totalDividas > 0 ? 'badge-deve' : 'badge-pago';
					const statusTexto = c.totalDividas > 0 ? 'Pendente' : 'Regular';

					tbody.innerHTML += `
								<tr>
									<td><strong>${c.nomeCompleto}</strong><br><small style="color: #666">${c.email}</small></td>
									<td>${c.cpf}</td>
									<td>${c.idade} anos</td>
									<td><strong>R$ ${c.totalDividas.toFixed(2)}</strong></td>
									<td><span class="status-badge ${statusClasse}">${statusTexto}</span></td>
								</tr>
							`;
				});
			} catch (error) {
				console.error('Erro ao carregar dados da API:', error);
			}
		}

		// Executa a busca assim que a tela abre
		window.onload = carregarClientesDoBanco;
	</script>

</body>
</html>
